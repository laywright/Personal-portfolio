<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Muiruri Alex</title>

  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">

  <!-- Page styling -->
  <style>
    /* General body styling */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Page title */
    h1 {
      color: #e50914;
      margin-top: 2rem;
      font-size: 3rem;
    }

    /* Container for the form and social links */
    .contact-container {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 40px;
      margin: 2rem auto;
      border-radius: 15px;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    /* Form layout */
    form {
      display: flex;
      flex-direction: column;
    }

    /* Form labels */
    label {
      margin-top: 20px;
      text-align: left;
      font-size: 1rem;
      font-weight: bold;
    }

    /* Input and textarea styling */
    input,
    textarea {
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    /* Message box */
    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* Submit button */
    button {
      margin-top: 20px;
      padding: 12px;
      background-color: #e50914;
      color: white;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    /* Button hover effect */
    button:hover {
      background-color: #b20710;
    }

    /* Social media icons section */
    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    /* Social icon links */
    .socials a {
      color: #e50914;
      font-size: 1.8rem;
      transition: transform 0.3s;
    }

    /* Social icon hover effect */
    .socials a:hover {
      transform: scale(1.2);
    }

    /* Back to home button */
    .back-btn {
      display: inline-block;
      margin: 2rem auto;
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      background-color: #e50914;
      padding: 12px 25px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    /* Hover effect for back button */
    .back-btn:hover {
      background-color: #b20710;
    }
  </style>
</head>

<body>
  <!-- Page Heading -->
  <h1>Contact Me</h1>

  <!-- Contact Form and Social Links Container -->
  <div class="contact-container">
    <!-- Form to collect contact info, sends data to Formspree -->
    <form action="https://formspree.io/f/mnqkqpga" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <!-- Submit button -->
      <button type="submit">Send Message</button>
    </form>

    <!-- Social media and contact icons -->
    <div class="socials">
      <a href="https://github.com/laywright" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/alex-muiruri-410457215/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="mailto:muirurialex991@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
    </div>
  </div>

  <!-- Navigation back to homepage -->
  <a href="index.html" class="back-btn">← Back to Home</a>
</body>

</html>
