<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muiruri Alex Portfolio</title>

    <!-- Font Awesome CDN for using icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Internal CSS styles for layout and theme -->
    <style>
        /* General body styles */
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        /* Container for entire page content */
        .container {
            padding: 50px;
        }

        /* Main heading style */
        h1 {
            color: #e50914;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Flexbox layout for profile options */
        .profiles-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        /* Styling for each profile option */
        .profile {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            width: 180px;
        }

        /* Hover effect for profile boxes */
        .profile:hover {
            transform: scale(1.1);
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Icon styling within profiles */
        .profile i {
            font-size: 50px;
            margin-bottom: 10px;
        }

        /* Text label under each icon */
        .profile span {
            display: block;
            font-size: 18px;
            font-weight: bold;
        }

        /* Theme toggle button styling (moon/sun icon) */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 25px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
            transition: color 0.3s;
        }

        .theme-toggle:hover {
            color: #e50914;
        }

        /* Light mode background and text color overrides */
        body.light-mode {
            background-color: white;
            color: black;
        }

        /* Light mode for profile containers */
        body.light-mode .profile {
            background-color: rgba(0, 0, 0, 0.1);
        }

        /* Light mode hover effect */
        body.light-mode .profile:hover {
            background-color: rgba(0, 0, 0, 0.2);
        }

        /* Light mode theme icon color */
        body.light-mode .theme-toggle {
            color: black;
        }

    </style>
</head>
<body>

    <!-- Theme toggle button (switch between dark and light mode) -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Main content container -->
    <div class="container">
        <!-- Portfolio header -->
        <h1>Muiruri Alex Portfolio</h1>

        <!-- Section title -->
        <h2>Who's Exploring?</h2>

        <!-- Grid of profile categories -->
        <div class="profiles-container">
            <!-- Profile 1: Programming Languages -->
            <div class="profile" style="background-color: #1a73e8;" onclick="location.href='languages.html';">
                <i class="fas fa-microchip"></i>
                <span>Programming Languages</span>
            </div>

            <!-- Profile 2: About -->
            <div class="profile" style="background-color: #9c27b0;" onclick="location.href='about.html';">
                <i class="fas fa-user"></i>
                <span>About</span>
            </div>

            <!-- Profile 3: Projects -->
            <div class="profile" style="background-color: #4caf50;" onclick="location.href='projects.html';">
                <i class="fas fa-code"></i>
                <span>Projects</span>
            </div>

            <!-- Profile 4: Education & Resume -->
            <div class="profile" style="background-color: #ff9800;" onclick="location.href='education.html';">
                <i class="fas fa-graduation-cap"></i>
                <span>Education & Resume</span>
            </div>

            <!-- Profile 5: Interests -->
            <div class="profile" style="background-color: #f44336;" onclick="location.href='interests.html';">
                <i class="fas fa-lightbulb"></i>
                <span>Interests</span>
            </div>

            <!-- Profile 6: Contact Me -->
            <div class="profile" style="background-color: #2196F3;" onclick="location.href='contact.html';">
                <i class="fas fa-phone"></i>
                <span>Contact Me</span>
            </div>
        </div>
    </div>

    <!-- JavaScript to toggle between light and dark theme -->
    <script>
        function toggleTheme() {
            // Toggle light-mode class on body
            document.body.classList.toggle('light-mode');

            // Change the icon (moon/sun) based on current theme
            let icon = document.querySelector('.theme-toggle i');
            if (document.body.classList.contains('light-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }
    </script>

</body>
</html>
